<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e8,#ffeef7,#fff);
overflow:hidden;
}

.container{
width:90%;
max-width:420px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(18px);
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,.15);
z-index:2;
}

h1{
color:#ff2d75;
margin-bottom:10px;
}

p{
color:#555;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
outline:none;
margin-bottom:20px;
text-align:center;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
background:#ff4f8b;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#error{
margin-top:15px;
color:red;
font-weight:bold;
}

.petal{
position:absolute;
top:-50px;
font-size:25px;
animation:fall linear infinite;
opacity:.8;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(360deg);
}
}
</style>

</head>
<body>

<div class="container">

<h1>🌸 Happy Friendship Day 🌸</h1>

<p>This surprise is only for <b>Arshu</b> 💖</p>

<input type="password" id="pass" placeholder="Enter Password">

<button onclick="checkPassword()">Unlock Surprise ❤️</button>

<p id="error"></p>

</div>

<script>

function checkPassword(){

let pass=document.getElementById("pass").value;

if(pass==="arshu"){

window.location.href="menu.html";

}

else{

document.getElementById("error").innerHTML="❌ Wrong Password";

}

}

petal.style.animationDuration=(5+Math.random()*8)+"s";
